<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Payroll Knowledge Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="logo-wrap"><img class="logo" src="assets/logo-sdworx.png" alt="SD Worx"></span>
        <div>
          <h1 class="app-title">Payroll Knowledge Assistant</h1>
          <p class="app-subtitle">Prototype – find it, understand it, trust it</p>
        </div>
      </div>
      <button type="button" id="reset-btn" class="btn btn-outline-white">Reset demo</button>
    </div>
  </header>

  <main class="chat">
    <ol id="thread" class="thread" aria-live="polite" aria-label="Conversation"></ol>
  </main>

  <div class="composer-bar">
    <form id="composer" class="composer" autocomplete="off">
      <div class="composer-meta">
        <span id="question-label" class="question-label" tabindex="-1">Question 1 of 2</span>
        <span id="country-chip" class="chip"></span>
      </div>
      <div class="composer-row">
        <label for="question-input" class="visually-hidden">Question</label>
        <textarea id="question-input" class="composer-input" rows="1" readonly></textarea>
        <button id="send-btn" type="submit" class="btn btn-primary btn-send" data-focus-key="send">Send</button>
      </div>
    </form>
    <footer class="site-footer">Demo with fictional data. Amounts are not real legislation.</footer>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
